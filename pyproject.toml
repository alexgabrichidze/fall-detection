[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "fall-detection-prototype"
version = "0.1.0"
description = "Local fall detection prototype and shared detector interface"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

# Live pins keep the same Pose extraction API as the upstream training code.
[project.optional-dependencies]
detection = [
    "numpy==1.26.4",
    "opencv-contrib-python==4.11.0.86",
    "cv2-enumerate-cameras==1.4.0",
    "mediapipe==0.10.21",
    "ai-edge-litert==2.3.0",
    "av==16.1.0",
    "pyobjc-framework-AVFoundation==12.2.2; sys_platform == 'darwin'",
]
ui = ["numpy>=1.26,<3", "opencv-contrib-python>=4.8,<5"]
audio = ["numpy>=1.26,<3", "sounddevice==0.5.6"]
voice = [
    "vosk==0.3.44; sys_platform == 'darwin'",
    "vosk==0.3.45; sys_platform != 'darwin'",
    "sounddevice==0.5.6",
]

[project.scripts]
fall-detection = "fall_detection.main:main"
fall-monitor-telegram = "fall_detection.telegram_relay:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
fall_detection = ["static/*", "prompts/*.wav", "relay-url.txt"]

