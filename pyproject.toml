[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "fall-detection-prototype"
version = "0.1.0"
description = "Local fall detection prototype and shared detector interface"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

# Optional, not yet verified together. The simulation needs none of these.
[project.optional-dependencies]
detection = [
    "numpy>=1.26,<3",
    "opencv-python>=4.8,<5",
    "mediapipe>=0.10.21,<2",
    "ai-edge-litert>=1.2,<3",
]
ui = ["numpy>=1.26,<3", "opencv-python>=4.8,<5"]
audio = ["numpy>=1.26,<3", "sounddevice>=0.5,<1"]
voice = ["vosk>=0.3.45,<0.4", "sounddevice>=0.5,<1"]

[project.scripts]
fall-detection = "fall_detection.main:main"

[tool.setuptools.packages.find]
where = ["src"]

